services:
  - type: web
    name: participatory-audio-backend
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port 10000"
    rootDir: backend
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: analysis_9dug
          property: connectionString
